<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wedding Planner">
<title>Simple Wedding Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  html { font-size: 16px; line-height: 1.5; }
  .skeleton { background:#e2e8f0; border-radius:.75rem; }
  .skeleton-pulse { animation: sk 1.2s ease-in-out infinite; }
  @keyframes sk { 50% { opacity:.5; } }
  @media (prefers-reduced-motion: reduce) { .skeleton-pulse { animation:none; } }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid #059669; outline-offset:2px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

<!-- HEADER STATIS -->
<header class="sticky top-0 z-30 bg-white shadow-sm" style="padding-top:env(safe-area-inset-top)">
  <div class="max-w-md mx-auto px-4 py-3">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-semibold text-slate-800">Wedding Planner</h1>
      <button id="btn-settings" aria-label="Pengaturan hari H dan budget" class="w-11 h-11 -mr-2 flex items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 transition-colors duration-150">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.3 4.3a1.7 1.7 0 013.4 0 1.7 1.7 0 002.5 1l.1-.1a1.7 1.7 0 012.4 2.4l-.1.1a1.7 1.7 0 001 2.5 1.7 1.7 0 010 3.4 1.7 1.7 0 00-1 2.5l.1.1a1.7 1.7 0 01-2.4 2.4l-.1-.1a1.7 1.7 0 00-2.5 1 1.7 1.7 0 01-3.4 0 1.7 1.7 0 00-2.5-1l-.1.1a1.7 1.7 0 01-2.4-2.4l.1-.1a1.7 1.7 0 00-1-2.5 1.7 1.7 0 010-3.4 1.7 1.7 0 001-2.5l-.1-.1a1.7 1.7 0 012.4-2.4l.1.1a1.7 1.7 0 002.5-1z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div id="countdown" class="mt-1 grid grid-cols-4 gap-2 text-center" aria-live="off">
      <div class="skeleton skeleton-pulse h-14"></div><div class="skeleton skeleton-pulse h-14"></div>
      <div class="skeleton skeleton-pulse h-14"></div><div class="skeleton skeleton-pulse h-14"></div>
    </div>
  </div>
</header>

<div id="banner" class="hidden max-w-md mx-auto mt-4 px-4"></div>

<main class="max-w-md mx-auto px-4 pt-4 pb-40">

  <!-- VIEW 1: TASKLIST -->
  <section id="view-task">
    <div class="flex gap-2" role="group" aria-label="Filter status" id="status-chips"></div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <div>
        <label for="f-cat" class="block text-sm text-slate-500 mb-1">Kategori</label>
        <select id="f-cat" class="w-full min-h-[44px] rounded-lg border border-slate-300 bg-white px-3 text-base">
          <option value="">Semua kategori</option>
        </select>
      </div>
      <div>
        <label for="f-time" class="block text-sm text-slate-500 mb-1">Waktu</label>
        <select id="f-time" class="w-full min-h-[44px] rounded-lg border border-slate-300 bg-white px-3 text-base">
          <option value="">Semua waktu</option>
          <option value="month">Bulan ini</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
    </div>
    <div id="task-list" class="mt-4 flex flex-col gap-4"></div>
  </section>

  <!-- VIEW 2: BUDGET -->
  <section id="view-budget" class="hidden">
    <div id="budget-summary"></div>
    <div id="budget-list" class="mt-4 flex flex-col gap-4"></div>
  </section>
</main>

<!-- FAB -->
<button id="fab" aria-label="Tambah tugas" class="fixed bottom-20 right-6 z-30 w-14 h-14 rounded-full bg-emerald-600 text-white shadow-lg flex items-center justify-center hover:bg-emerald-700 active:bg-emerald-800 transition-colors duration-150" style="margin-bottom:env(safe-area-inset-bottom)">
  <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
</button>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-md mx-auto grid grid-cols-2">
    <button data-nav="task" class="nav-btn h-16 flex flex-col items-center justify-center gap-0.5 text-sm transition-colors duration-150">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      Tasklist
    </button>
    <button data-nav="budget" class="nav-btn h-16 flex flex-col items-center justify-center gap-0.5 text-sm transition-colors duration-150">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18M7 15h3"/></svg>
      Budget
    </button>
  </div>
</nav>

<!-- DIALOG: TUGAS -->
<dialog id="dlg-task" class="m-auto w-[92%] max-w-md rounded-2xl p-0 backdrop:bg-black/40">
  <form id="form-task" method="dialog" class="p-5 flex flex-col gap-4">
    <h2 id="task-dlg-title" class="text-lg font-semibold">Tambah tugas</h2>
    <div>
      <label for="t-title" class="block text-sm font-medium text-slate-700 mb-1">Nama tugas</label>
      <input id="t-title" required maxlength="120" class="w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div>
      <label for="t-cat" class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
      <select id="t-cat" required class="w-full min-h-[44px] rounded-lg border border-slate-300 bg-white px-3 text-base"></select>
    </div>
    <div>
      <label for="t-due" class="block text-sm font-medium text-slate-700 mb-1">Tenggat waktu</label>
      <input id="t-due" type="date" required class="w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div class="flex gap-2 pt-1">
      <button type="button" id="t-delete" class="hidden min-h-[44px] px-4 rounded-lg text-rose-600 font-medium hover:bg-rose-50 transition-colors duration-150">Hapus</button>
      <span class="flex-1"></span>
      <button type="button" data-close class="min-h-[44px] px-4 rounded-lg text-slate-600 font-medium hover:bg-slate-100 transition-colors duration-150">Batal</button>
      <button type="submit" class="min-h-[44px] px-5 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 transition-colors duration-150">Simpan tugas</button>
    </div>
  </form>
</dialog>

<!-- DIALOG: BUDGET -->
<dialog id="dlg-budget" class="m-auto w-[92%] max-w-md rounded-2xl p-0 backdrop:bg-black/40">
  <form id="form-budget" method="dialog" class="p-5 flex flex-col gap-4">
    <h2 id="budget-dlg-title" class="text-lg font-semibold">Tambah pengeluaran</h2>
    <div>
      <label for="b-name" class="block text-sm font-medium text-slate-700 mb-1">Nama item</label>
      <input id="b-name" required maxlength="120" class="w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div>
      <label for="b-est" class="block text-sm font-medium text-slate-700 mb-1">Estimasi harga (Rp)</label>
      <input id="b-est" inputmode="numeric" required class="money w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div>
      <label for="b-act" class="block text-sm font-medium text-slate-700 mb-1">Biaya aktual (Rp)</label>
      <input id="b-act" inputmode="numeric" class="money w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base" value="0">
    </div>
    <p id="b-diff" class="text-sm text-slate-500"></p>
    <div class="flex gap-2 pt-1">
      <button type="button" id="b-delete" class="hidden min-h-[44px] px-4 rounded-lg text-rose-600 font-medium hover:bg-rose-50 transition-colors duration-150">Hapus</button>
      <span class="flex-1"></span>
      <button type="button" data-close class="min-h-[44px] px-4 rounded-lg text-slate-600 font-medium hover:bg-slate-100 transition-colors duration-150">Batal</button>
      <button type="submit" class="min-h-[44px] px-5 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 transition-colors duration-150">Simpan item</button>
    </div>
  </form>
</dialog>

<!-- DIALOG: PENGATURAN -->
<dialog id="dlg-settings" class="m-auto w-[92%] max-w-md rounded-2xl p-0 backdrop:bg-black/40">
  <form id="form-settings" method="dialog" class="p-5 flex flex-col gap-4">
    <h2 class="text-lg font-semibold">Pengaturan</h2>
    <div>
      <label for="s-date" class="block text-sm font-medium text-slate-700 mb-1">Tanggal dan jam hari H</label>
      <input id="s-date" type="datetime-local" required class="w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div>
      <label for="s-budget" class="block text-sm font-medium text-slate-700 mb-1">Total plafon anggaran (Rp)</label>
      <input id="s-budget" inputmode="numeric" required class="money w-full min-h-[44px] rounded-lg border border-slate-300 px-3 text-base">
    </div>
    <div class="flex gap-2 pt-1">
      <span class="flex-1"></span>
      <button type="button" data-close class="min-h-[44px] px-4 rounded-lg text-slate-600 font-medium hover:bg-slate-100 transition-colors duration-150">Batal</button>
      <button type="submit" class="min-h-[44px] px-5 rounded-lg bg-emerald-600 text-white font-medium hover:bg-emerald-700 transition-colors duration-150">Simpan pengaturan</button>
    </div>
  </form>
</dialog>

<div id="toast" class="hidden fixed top-24 inset-x-4 z-50 max-w-md mx-auto rounded-lg bg-slate-800 text-white text-sm px-4 py-3 shadow-lg"></div>

<script>
(() => {
  'use strict';
  const CATEGORIES = ['KUA', 'Venue', 'Katering', 'Pakaian', 'Undangan', 'Dekorasi'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rp = (n) => 'Rp ' + new Intl.NumberFormat('id-ID').format(Number(n) || 0);
  const num = (s) => parseInt(String(s).replace(/\D/g, ''), 10) || 0;
  const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDate = (s) => parseDate(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  const pad = (n) => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  const state = { tasks: [], budgets: [], settings: null, view: 'task',
    fStatus: 'all', fCat: '', fTime: '', loadingTasks: true, loadingBudget: true,
    editTask: null, editBudget: null };

  /* ---------- Supabase ---------- */
  const cfg = window.APP_CONFIG || {};
  let sb = null;
  const configured = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY;
  if (configured && window.supabase) sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3500);
  }
  function banner(html) { const b = $('banner'); b.innerHTML = `<div class="rounded-lg bg-amber-50 border border-amber-300 text-amber-800 text-sm p-3">${html}</div>`; b.classList.remove('hidden'); }

  async function init() {
    renderChips(); fillSelects(); setView('task'); renderTasks(); renderBudget();
    if (!sb) { banner('Aplikasi belum terhubung ke Supabase. Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> (lihat README).'); state.loadingTasks = state.loadingBudget = false; renderTasks(); renderBudget(); renderCountdown(); return; }
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { const { error } = await sb.auth.signInAnonymously(); if (error) throw error; }
    } catch (e) {
      banner('Gagal masuk. Aktifkan <b>Anonymous sign-ins</b> di Supabase: Authentication → Sign In / Providers.');
      state.loadingTasks = state.loadingBudget = false; renderTasks(); renderBudget(); return;
    }
    await Promise.all([loadSettings(), loadTasks(), loadBudgets()]);
    sb.channel('wp-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, loadTasks)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'budgets' }, loadBudgets)
      .subscribe();
  }

  async function loadSettings() {
    const { data, error } = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
    if (error) { toast('Gagal memuat pengaturan.'); return; }
    state.settings = data; renderCountdown(); renderBudget();
  }
  async function loadTasks() {
    const { data, error } = await sb.from('tasks').select('*').order('due_date', { ascending: true });
    state.loadingTasks = false;
    if (error) toast('Gagal memuat tugas. Periksa koneksi.'); else state.tasks = data;
    renderTasks();
  }
  async function loadBudgets() {
    const { data, error } = await sb.from('budgets').select('*').order('item_name', { ascending: true });
    state.loadingBudget = false;
    if (error) toast('Gagal memuat budget. Periksa koneksi.'); else state.budgets = data;
    renderBudget();
  }

  /* ---------- Countdown ---------- */
  function countdownParts(target) {
    const now = new Date();
    if (target <= now) return null;
    let m = (target.getFullYear() - now.getFullYear()) * 12 + target.getMonth() - now.getMonth();
    const addM = (n) => { const d = new Date(now); d.setMonth(d.getMonth() + n); return d; };
    while (m > 0 && addM(m) > target) m--;
    let rest = target - addM(m);
    const days = Math.floor(rest / 864e5); rest -= days * 864e5;
    const hours = Math.floor(rest / 36e5); rest -= hours * 36e5;
    const mins = Math.floor(rest / 6e4);
    return [m, days, hours, mins];
  }
  function renderCountdown() {
    const el = $('countdown');
    if (!state.settings) { if (!sb) el.innerHTML = '<p class="col-span-4 text-sm text-slate-500 py-3">Hari H belum diatur.</p>'; return; }
    const p = countdownParts(new Date(state.settings.wedding_date));
    if (!p) { el.className = 'mt-1'; el.innerHTML = '<p class="text-emerald-700 font-medium py-2">Hari H sudah tiba. Selamat menempuh hidup baru!</p>'; return; }
    el.className = 'mt-1 grid grid-cols-4 gap-2 text-center';
    const labels = ['Bulan', 'Hari', 'Jam', 'Menit'];
    el.innerHTML = p.map((v, i) => `<div class="rounded-lg bg-emerald-50 py-2"><div class="text-2xl font-semibold text-emerald-700 tabular-nums leading-tight">${pad(v)}</div><div class="text-xs text-slate-500">${labels[i]}</div></div>`).join('');
  }
  setInterval(renderCountdown, 10000);

  /* ---------- Navigasi ---------- */
  function setView(v) {
    state.view = v;
    $('view-task').classList.toggle('hidden', v !== 'task');
    $('view-budget').classList.toggle('hidden', v !== 'budget');
    document.querySelectorAll('.nav-btn').forEach((b) => {
      const on = b.dataset.nav === v;
      b.classList.toggle('text-emerald-600', on); b.classList.toggle('font-semibold', on);
      b.classList.toggle('text-slate-500', !on);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
    $('fab').setAttribute('aria-label', v === 'task' ? 'Tambah tugas' : 'Tambah pengeluaran');
  }
  document.querySelectorAll('.nav-btn').forEach((b) => b.addEventListener('click', () => setView(b.dataset.nav)));

  /* ---------- Filter ---------- */
  function fillSelects() {
    $('f-cat').insertAdjacentHTML('beforeend', CATEGORIES.map((c) => `<option>${c}</option>`).join(''));
    $('t-cat').innerHTML = CATEGORIES.map((c) => `<option>${c}</option>`).join('');
  }
  function renderChips() {
    const items = [['all', 'Semua'], ['pending', 'Pending'], ['done', 'Selesai']];
    $('status-chips').innerHTML = items.map(([k, l]) => {
      const on = state.fStatus === k;
      return `<button data-status="${k}" aria-pressed="${on}" class="min-h-[44px] flex-1 rounded-full border text-sm font-medium transition-colors duration-150 ${on ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white border-slate-300 text-slate-700'}">${l}</button>`;
    }).join('');
  }
  $('status-chips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]'); if (!b) return;
    state.fStatus = b.dataset.status; renderChips(); renderTasks();
  });
  $('f-cat').addEventListener('change', (e) => { state.fCat = e.target.value; renderTasks(); });
  $('f-time').addEventListener('change', (e) => { state.fTime = e.target.value; renderTasks(); });

  /* ---------- Tasklist ---------- */
  const isOverdue = (t) => !t.is_completed && t.due_date < todayStr();
  function renderTasks() {
    const list = $('task-list');
    if (state.loadingTasks) {
      list.innerHTML = Array.from({ length: 4 }, () => '<div class="skeleton skeleton-pulse h-24"></div>').join(''); return;
    }
    const today = todayStr(), ym = today.slice(0, 7);
    const rows = state.tasks.filter((t) =>
      (state.fStatus === 'all' || (state.fStatus === 'done') === t.is_completed) &&
      (!state.fCat || t.category === state.fCat) &&
      (!state.fTime || (state.fTime === 'month' ? t.due_date.slice(0, 7) === ym : isOverdue(t)))
    ).sort((a, b) => a.due_date.localeCompare(b.due_date));
    if (!rows.length) {
      list.innerHTML = `<div class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-slate-500">${state.tasks.length ? 'Tidak ada tugas yang cocok dengan filter.' : 'Belum ada tugas. Ketuk tombol + untuk menambah tugas pertama.'}</div>`; return;
    }
    list.innerHTML = rows.map((t) => {
      const od = isOverdue(t);
      const status = t.is_completed ? '<span class="text-emerald-700">Selesai</span>' : od ? '<span class="text-rose-600 font-medium">Overdue</span>' : '<span class="text-slate-500">Pending</span>';
      return `<article class="flex items-start gap-1 rounded-xl bg-white p-2 pr-3 border ${od ? 'border-rose-300' : 'border-slate-200'}">
        <button data-toggle="${t.id}" role="checkbox" aria-checked="${t.is_completed}" aria-label="Tandai ${esc(t.title)} selesai" class="shrink-0 w-11 h-11 flex items-center justify-center">
          <span class="w-6 h-6 rounded-md border-2 flex items-center justify-center transition-colors duration-150 ${t.is_completed ? 'bg-emerald-600 border-emerald-600' : 'bg-white border-slate-400'}">
            ${t.is_completed ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
          </span></button>
        <button data-edit="${t.id}" class="flex-1 text-left py-2 min-h-[44px]">
          <div class="text-sm text-slate-500">${esc(t.category)}</div>
          <div class="font-medium ${t.is_completed ? 'line-through text-slate-400' : 'text-slate-800'}">${esc(t.title)}</div>
          <div class="text-sm text-slate-500 mt-0.5">Tenggat: ${fmtDate(t.due_date)} &nbsp;|&nbsp; ${status}</div>
        </button></article>`;
    }).join('');
  }
  $('task-list').addEventListener('click', async (e) => {
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const t = state.tasks.find((x) => x.id === tg.dataset.toggle); if (!t || !sb) return;
      t.is_completed = !t.is_completed; renderTasks();
      const { error } = await sb.from('tasks').update({ is_completed: t.is_completed }).eq('id', t.id);
      if (error) { t.is_completed = !t.is_completed; renderTasks(); toast('Gagal menyimpan status. Coba lagi.'); }
      return;
    }
    const ed = e.target.closest('[data-edit]');
    if (ed) openTask(state.tasks.find((x) => x.id === ed.dataset.edit));
  });

  /* ---------- Dialog helpers ---------- */
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
  document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
  document.querySelectorAll('.money').forEach((i) => i.addEventListener('input', () => {
    const n = num(i.value); i.value = i.value === '' ? '' : new Intl.NumberFormat('id-ID').format(n);
  }));
  const setMoney = (el, n) => { el.value = new Intl.NumberFormat('id-ID').format(Number(n) || 0); };
  const guard = () => { if (!sb) { toast('Hubungkan Supabase terlebih dahulu.'); return false; } return true; };

  /* ---------- Dialog tugas ---------- */
  function openTask(t) {
    state.editTask = t || null;
    $('task-dlg-title').textContent = t ? 'Ubah tugas' : 'Tambah tugas';
    $('t-title').value = t ? t.title : '';
    $('t-cat').value = t ? t.category : CATEGORIES[0];
    $('t-due').value = t ? t.due_date : todayStr();
    $('t-delete').classList.toggle('hidden', !t);
    $('dlg-task').showModal();
  }
  $('form-task').addEventListener('submit', async (e) => {
    e.preventDefault(); if (!guard()) return;
    const row = { title: $('t-title').value.trim(), category: $('t-cat').value, due_date: $('t-due').value };
    if (!row.title) return;
    const q = state.editTask ? sb.from('tasks').update(row).eq('id', state.editTask.id) : sb.from('tasks').insert({ ...row, is_completed: false });
    const { error } = await q;
    if (error) return toast('Gagal menyimpan tugas.');
    $('dlg-task').close(); loadTasks();
  });
  $('t-delete').addEventListener('click', async () => {
    if (!state.editTask || !guard() || !confirm('Hapus tugas ini?')) return;
    const { error } = await sb.from('tasks').delete().eq('id', state.editTask.id);
    if (error) return toast('Gagal menghapus tugas.');
    $('dlg-task').close(); loadTasks();
  });

  /* ---------- Budget ---------- */
  function renderBudget() {
    const sum = $('budget-summary'), list = $('budget-list');
    if (state.loadingBudget) {
      sum.innerHTML = '<div class="skeleton skeleton-pulse h-32"></div>';
      list.innerHTML = Array.from({ length: 3 }, () => '<div class="skeleton skeleton-pulse h-20"></div>').join(''); return;
    }
    const cap = state.settings ? Number(state.settings.master_budget) : 0;
    const used = state.budgets.reduce((a, b) => a + Number(b.actual_cost), 0);
    const left = cap - used;
    const pct = cap > 0 ? (used / cap) * 100 : 0;
    const color = pct > 90 ? 'bg-rose-600' : pct >= 75 ? 'bg-amber-500' : 'bg-emerald-500';
    const leftColor = left < 0 ? 'text-rose-600' : 'text-slate-800';
    sum.innerHTML = `<div class="rounded-xl bg-white border border-slate-200 p-4">
      <div class="text-sm text-slate-500">Sisa saldo</div>
      <div class="text-2xl font-semibold tabular-nums ${leftColor}">${rp(left)}</div>
      <div class="mt-3 h-3 rounded-full bg-slate-200 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}">
        <div class="h-full ${color}" style="width:${Math.min(pct, 100)}%"></div></div>
      <div class="mt-1 text-sm text-slate-500">${Math.round(pct)}% terpakai</div>
      <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
        <div><div class="text-slate-500">Total plafon</div><div class="font-medium tabular-nums">${rp(cap)}</div></div>
        <div><div class="text-slate-500">Total terpakai</div><div class="font-medium tabular-nums">${rp(used)}</div></div>
      </div></div>`;
    if (!state.budgets.length) {
      list.innerHTML = '<div class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-slate-500">Belum ada pengeluaran. Ketuk tombol + untuk mencatat item pertama.</div>'; return;
    }
    list.innerHTML = state.budgets.map((b) => {
      const est = Number(b.est_cost), act = Number(b.actual_cost), diff = est - act;
      const lunas = est > 0 && act >= est;
      const diffTxt = diff >= 0 ? `Selisih: ${rp(diff)} di bawah estimasi` : `<span class="text-rose-600 font-medium">Selisih: ${rp(-diff)} melebihi estimasi</span>`;
      return `<button data-bedit="${b.id}" class="text-left w-full min-h-[44px] rounded-xl bg-white border border-slate-200 p-4">
        <div class="flex items-center justify-between gap-2"><span class="font-medium text-slate-800">${esc(b.item_name)}</span>${lunas ? '<span class="text-sm text-emerald-700 font-medium">Lunas</span>' : ''}</div>
        <div class="text-sm text-slate-500 mt-1 tabular-nums">Est: ${rp(est)} &nbsp;|&nbsp; Akt: ${rp(act)}</div>
        <div class="text-sm text-slate-500 mt-0.5">${diffTxt}</div></button>`;
    }).join('');
  }
  $('budget-list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-bedit]'); if (b) openBudget(state.budgets.find((x) => x.id === b.dataset.bedit));
  });
  function updateDiff() {
    const d = num($('b-est').value) - num($('b-act').value);
    $('b-diff').textContent = d >= 0 ? `Selisih: ${rp(d)} di bawah estimasi` : `Selisih: ${rp(-d)} melebihi estimasi`;
  }
  $('b-est').addEventListener('input', updateDiff); $('b-act').addEventListener('input', updateDiff);
  function openBudget(b) {
    state.editBudget = b || null;
    $('budget-dlg-title').textContent = b ? 'Ubah pengeluaran' : 'Tambah pengeluaran';
    $('b-name').value = b ? b.item_name : '';
    setMoney($('b-est'), b ? b.est_cost : 0); setMoney($('b-act'), b ? b.actual_cost : 0);
    $('b-delete').classList.toggle('hidden', !b); updateDiff();
    $('dlg-budget').showModal();
  }
  $('form-budget').addEventListener('submit', async (e) => {
    e.preventDefault(); if (!guard()) return;
    const row = { item_name: $('b-name').value.trim(), est_cost: num($('b-est').value), actual_cost: num($('b-act').value) };
    if (!row.item_name) return;
    const q = state.editBudget ? sb.from('budgets').update(row).eq('id', state.editBudget.id) : sb.from('budgets').insert(row);
    const { error } = await q;
    if (error) return toast('Gagal menyimpan item.');
    $('dlg-budget').close(); loadBudgets();
  });
  $('b-delete').addEventListener('click', async () => {
    if (!state.editBudget || !guard() || !confirm('Hapus item ini?')) return;
    const { error } = await sb.from('budgets').delete().eq('id', state.editBudget.id);
    if (error) return toast('Gagal menghapus item.');
    $('dlg-budget').close(); loadBudgets();
  });

  /* ---------- Pengaturan ---------- */
  $('btn-settings').addEventListener('click', () => {
    const s = state.settings;
    const d = s ? new Date(s.wedding_date) : new Date(Date.now() + 180 * 864e5);
    $('s-date').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    setMoney($('s-budget'), s ? s.master_budget : 0);
    $('dlg-settings').showModal();
  });
  $('form-settings').addEventListener('submit', async (e) => {
    e.preventDefault(); if (!guard()) return;
    const row = { id: 1, wedding_date: new Date($('s-date').value).toISOString(), master_budget: num($('s-budget').value) };
    const { error } = await sb.from('settings').upsert(row);
    if (error) return toast('Gagal menyimpan pengaturan.');
    state.settings = row; $('dlg-settings').close(); renderCountdown(); renderBudget();
  });

  /* ---------- FAB ---------- */
  $('fab').addEventListener('click', () => (state.view === 'task' ? openTask() : openBudget()));

  /* ---------- PWA ---------- */
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  init();
})();
</script>
</body>
</html>
